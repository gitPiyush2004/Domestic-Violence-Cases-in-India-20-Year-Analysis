# Netlify config for THIS folder only.
#
# The repository publishes two independent sites. Netlify builds one site per
# configuration, so each site sets its Base directory to its own folder and
# Netlify reads the netlify.toml it finds there. publish = "." then means
# "this folder is the web root".
#
# data.js is committed alongside index.html rather than referenced from
# ../dashboard/. Published as its own site this folder IS the web root, so a
# relative path out of it resolves to nothing and the whole report would render
# blank. dashboard/build_data.py writes both copies from one generator.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
