# Netlify configuration
#
# This repository publishes two static sites. Netlify builds one site per
# configuration, so each is deployed as its own Netlify site pointed at a
# different publish directory:
#
#   dashboard/         the interactive web dashboard (charts render from data.js)
#   powerbi-showcase/  a static walkthrough of the Power BI report
#
# Set the publish directory in the Netlify UI (Site settings -> Build &
# deploy -> Publish directory) or with `netlify deploy --dir=<folder>`.
#
# Neither site has a build step or any dependency - they are plain HTML, CSS
# and JS with no CDN calls, so they work offline and from a file:// URL too.

[build]
  publish = "dashboard"
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Long cache for the generated data file, which is content-stable between ETL
# runs; short cache for the HTML so a redeploy is picked up immediately.
[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
